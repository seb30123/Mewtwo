name: Test CPA pipeline

on:
  push:
    branches: [main]
    paths:
      - 'attacks/06-mlkem-cpa-pairpointwise/**'
      - 'tests/**'
      - '.github/workflows/test-cpa.yml'
  pull_request:
    branches: [main]
  # Permet un déclenchement manuel depuis l'UI
  workflow_dispatch:

jobs:
  test-cpa-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.24.* scipy==1.10.* pytest

      - name: Generate synthetic test dataset
        run: python tests/generate_synthetic_dataset.py

      - name: Run smoke tests
        run: pytest tests/ -v

      - name: Sanity check — vectorized CPA against scipy reference
        run: python tests/test_correlation_equivalence.py

      - name: Print summary
        run: |
          echo "✓ All tests passed"
          echo "✓ CPA pipeline validated on synthetic dataset"
          echo "✓ fqmul implementation matches Kyber reference"
